services:
  postgres:
    image: postgres:17-alpine
    container_name: jungle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jungle_gaming
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: jungle_local_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jungle -d jungle_gaming']
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:4
    container_name: jungle-localstack
    restart: unless-stopped
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      PERSISTENCE: '1'
    ports:
      - '4566:4566'
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres_data:
  localstack_data:
